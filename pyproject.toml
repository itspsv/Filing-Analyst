[project]
name = "filing-analyst"
version = "0.1.0"
description = "Cited answers about US companies from their SEC 10-K filings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "duckdb==1.5.6",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "qdrant-client==1.20.0",
    "sentence-transformers==6.2.0",
    "sqlglot==30.29.0",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11"]
build-backend = "uv_build"

[tool.uv]
# Packages pulled in by langgraph: keep them at releases at least two weeks old (Nov 18, 2026).
constraint-dependencies = [
    "langchain-core==1.7.5",
    "langgraph-checkpoint==4.3.1",
    "langgraph-prebuilt==1.1.1",
    "langgraph-sdk==0.4.12",
    "xxhash==3.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: calls the real SEC website (skipped when SEC_USER_AGENT is not set)",
    "data: reads downloaded files in data/ (skipped when they are missing)",
]
